# Configuración base — completar con las credenciales reales al desplegar
# (no subir credenciales reales al repositorio; usar variables de entorno).

spring.application.name=km0-automotores-backend

spring.datasource.url=jdbc:postgresql://localhost:5432/km0_automotores
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
